<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — БГ Иновации</title>
  <style>
    @font-face {
      font-family: 'Sofia Sans';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url(fonts/sofia-sans-cyrillic.woff2) format('woff2');
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }
    @font-face {
      font-family: 'Sofia Sans';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url(fonts/sofia-sans-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Sofia Sans';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url(fonts/sofia-sans-cyrillic.woff2) format('woff2');
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }
    @font-face {
      font-family: 'Sofia Sans';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url(fonts/sofia-sans-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sofia Sans', system-ui, sans-serif;
      background: #F7F7F5;
      color: #111418;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0B0D10; color: #E8EAED; }
      a { color: #60A5FA; }
    }
    .error-page h1 {
      font-size: clamp(4rem, 15vw, 10rem);
      font-weight: 700;
      line-height: 1;
      opacity: 0.15;
      margin-bottom: -1rem;
    }
    .error-page p {
      font-size: 1.1rem;
      margin-bottom: 0.75rem;
      line-height: 1.6;
    }
    .error-page .gag {
      color: #4B5563;
      font-size: 0.95rem;
    }
    @media (prefers-color-scheme: dark) {
      .error-page .gag { color: #9CA3AF; }
    }
    .error-page a {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.7rem 2rem;
      background: #1D4ED8;
      color: #fff;
      border-radius: 100px;
      text-decoration: none;
      font-weight: 600;
      min-height: 44px;
    }
    @media (prefers-color-scheme: dark) {
      .error-page a { background: #60A5FA; color: #0B0D10; }
    }
    .error-page a:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="error-page">
    <h1>404</h1>
    <p>Страницата не е намерена.</p>
    <p class="gag">Точно както майсторът, който обеща да дойде вчера.</p>
    <a href="index.html">Обратно към началото</a>
  </div>
</body>
</html>
